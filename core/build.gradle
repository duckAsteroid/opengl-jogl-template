plugins {
  id 'java-library'
  id 'io.github.duckasteroid.agent-docs.publish' version '1.0.10'
  id 'duckasteroid-java' version '1.0.0-RC3'
  id 'duckasteroid-github-packages-publish' version '1.0.0-RC3'
}

agentDocs {
}

dependencies {
  // Logging
  api 'org.slf4j:slf4j-api:2.1.0-alpha1'
  runtimeOnly 'ch.qos.logback:logback-classic:1.6.0'

  // Core utilities
  implementation "org.joml:joml:${jomlVersion}"

  // FFT for spectrum analysis
  implementation 'com.github.wendykierp:JTransforms:3.2'

  // Pure-Java H.264/MP4 encoder for video recording
  implementation 'org.jcodec:jcodec:0.2.5'
  implementation 'org.jcodec:jcodec-javase:0.2.5'

  // LWJGL platform BOM and core libs; runtime natives set for linux by default
  implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
  implementation "org.lwjgl:lwjgl"
  runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
  implementation "org.lwjgl:lwjgl-glfw"
  runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
  implementation "org.lwjgl:lwjgl-opengl"
  runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"

  // use Google AutoService for service provider generation
  compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
  annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

  testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'
  testImplementation 'org.junit.platform:junit-platform-launcher:6.1.2'
  testImplementation 'org.mockito:mockito-inline:5.2.0'
}

tasks.named('packageAgentDocs') {
  archiveBaseName = 'render-core'
}

// duckasteroid-java already registers the 'mavenJava' publication; just rename the artifact.
publishing {
  publications {
    named('mavenJava', MavenPublication) {
      artifactId = 'render-core'
    }
  }
}
