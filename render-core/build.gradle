plugins {
  id 'java-library'
  id 'io.github.duckasteroid.agent-docs' version '3.0.0'
  id 'io.github.duckasteroid.agent-docs.publish' version '3.0.0'
  id 'duckasteroid-java' version '1.2.0-RC6'
  id 'duckasteroid-github-packages-publish' version '1.2.0-RC6'
  id 'duckasteroid-release-flow' version '1.2.0-RC6'
}

agentDocsPublish {
}

dependencies {
  // Logging
  api 'org.slf4j:slf4j-api:2.1.0-alpha1'
  runtimeOnly 'ch.qos.logback:logback-classic:1.6.0'

  // Core utilities
  implementation "org.joml:joml:${jomlVersion}"

  // FFT for spectrum analysis
  implementation 'com.github.wendykierp:JTransforms:3.2'

  // Pure-Java H.264/MP4 encoder for video recording
  implementation 'org.jcodec:jcodec:0.2.5'
  implementation 'org.jcodec:jcodec-javase:0.2.5'

  // LWJGL platform BOM and core libs; runtime natives set for linux by default
  implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
  implementation "org.lwjgl:lwjgl"
  runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
  implementation "org.lwjgl:lwjgl-glfw"
  runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
  implementation "org.lwjgl:lwjgl-opengl"
  runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"

  // use Google AutoService for service provider generation
  compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
  annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

  testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'
  testImplementation 'org.junit.platform:junit-platform-launcher:6.1.2'
  testImplementation 'org.mockito:mockito-inline:5.2.0'
}

// ── Offline beat-tracking evaluation (docs/beat-tracking-plan.md) ────────────
// A separate source set so the harness (and its JSON dependency) never ships in the library jar.
sourceSets {
  beatEval {
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
  }
}

configurations {
  beatEvalImplementation.extendsFrom implementation
  beatEvalRuntimeOnly.extendsFrom runtimeOnly
  testImplementation.extendsFrom beatEvalImplementation
}

dependencies {
  // JAMS annotation files
  beatEvalImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
  testImplementation sourceSets.beatEval.output
}

tasks.register('beatEval', JavaExec) {
  group = 'verification'
  description = 'Scores the beat analysers against synthetic and local datasets; pass options with --args (see docs/beat-tracking-plan.md).'
  classpath = sourceSets.beatEval.runtimeClasspath
  mainClass = 'com.asteroid.duck.opengl.util.audio.beat.eval.BeatEval'
  systemProperty 'beatEval.out', layout.buildDirectory.dir('beat-eval').get().asFile.path
  maxHeapSize = '2g'
}
